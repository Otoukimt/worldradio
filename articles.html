<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radio Guides, Explainers and Tips — LiveRadio</title>
<meta name="description" content="All LiveRadio articles: country guides, explainers on how internet radio works, and practical listening tips.">
<meta name="theme-color" content="#eef3fb">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1a;--card:#161d31;--line:#232c45;--txt:#eef2ff;--mut:#93a0c0;
--acc:#22d3a6;--acc2:#6366f1;--font:'Outfit','Cairo',system-ui,sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Cairo',var(--font)}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit}
header{position:sticky;top:0;z-index:30;background:rgba(11,15,26,.93);backdrop-filter:blur(14px);
border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:860px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--txt)}
.logo-dot{width:11px;height:11px;border-radius:50%;background:var(--acc)}
.logo span{color:var(--acc)}
.spacer{flex:1}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:8px 14px;
border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:clamp(26px,6vw,36px);line-height:1.25;margin:0 0 10px;font-weight:800}
.lead{color:var(--mut);font-size:16px;line-height:1.7;margin:0 0 26px;max-width:620px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 16px;
border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04221b}
.arts{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.art{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;transition:.2s;display:block}
.art:hover{border-color:var(--acc);transform:translateY(-2px)}
.art .tag{font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.art h2{margin:8px 0 6px;font-size:17px;font-weight:700;line-height:1.35;color:var(--txt)}
.art p{margin:0 0 10px;color:var(--mut);font-size:14px;line-height:1.55}
.art .d{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
footer{border-top:1px solid var(--line);margin-top:40px;padding:26px 18px;text-align:center;color:var(--mut);font-size:14px}
footer nav{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:12px}
footer nav a{color:var(--mut)}
footer nav a:hover{color:var(--acc)}
</style>

<style>
/* light theme is the default; dark is opt-in */
:root{
  --bg:#f3f6fc; --card:#ffffff; --card2:#eef3fc; --line:#dde5f2;
  --txt:#111a2e; --mut:#5a6880; --acc:#0d9488; --acc2:#5b53e0; --red:#e11d48;
  --shadow:rgba(23,38,74,.09);
  --headG:linear-gradient(120deg,#e8f1ff 0%,#eeeafd 48%,#fdeef4 100%);
  --footG:linear-gradient(120deg,#fdeef4 0%,#eeeafd 52%,#e8f1ff 100%);
  --cardG:linear-gradient(170deg,#ffffff 0%,#f6f9ff 100%);
}
html[data-theme="dark"]{
  --bg:#0b0f1a; --card:#161d31; --card2:#1c2440; --line:#232c45;
  --txt:#eef2ff; --mut:#93a0c0; --acc:#22d3a6; --acc2:#6366f1; --red:#f43f5e;
  --shadow:rgba(0,0,0,.35);
  --headG:linear-gradient(120deg,#0e1526,#121a2e 60%,#17132a);
  --footG:linear-gradient(120deg,#17132a,#121a2e 48%,#0e1526);
  --cardG:linear-gradient(170deg,#161d31,#141b2d);
}
body{background:var(--bg)}
header{background:var(--headG);backdrop-filter:blur(10px)}
footer{background:var(--footG)}
.btn{background:var(--cardG);box-shadow:0 1px 2px var(--shadow)}
.box,.art,.mail{background:var(--cardG);box-shadow:0 2px 8px var(--shadow)}
.chip{background:var(--cardG)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
th{background:var(--card2)}
code{background:var(--card2)}
p,ul,ol{color:var(--txt);opacity:.93}
.cta{color:#fff;box-shadow:0 6px 18px var(--shadow)}
</style>

<script>
(function(){
  var t='light';
  try{var v=JSON.parse(localStorage.getItem('lr_theme'));if(v==='dark'||v==='light')t=v;}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',t==='dark'?'#0e1526':'#eef3fb');
})();
</script>
</head>
<body>

<header>
  <div class="hrow">
    <a class="logo" href="./"><span class="logo-dot"></span>Live<span>Radio</span></a>
    <div class="spacer"></div>
    <a class="btn" href="./" data-en="&larr; Stations" data-ar="&rarr; المحطات">&larr; Stations</a>
    <button class="btn" id="langBtn">العربية</button>
  </div>
</header>

<main>
  <h1 data-en="Guides, explainers and tips" data-ar="أدلة وشروح ونصائح">Guides, explainers and tips</h1>
  <p class="lead" data-en="Everything we have written about radio: how it works, where to listen, and how to get more out of it." data-ar="كل ما كتبناه عن الراديو: كيف يعمل، وأين تستمع، وكيف تحصل منه على أكثر مما تتوقع.">Everything we have written about radio.</p>

  <div class="chips" id="chips"></div>
  <div class="arts" id="list"></div>
  <div class="empty" id="empty" style="display:none" data-en="Nothing here yet." data-ar="لا شيء هنا بعد.">Nothing here yet.</div>
</main>

<footer>
  <nav>
    <a href="./" data-en="Home" data-ar="الرئيسية">Home</a>
    <a href="./about.html" data-en="About" data-ar="من نحن">About</a>
    <a href="./privacy.html" data-en="Privacy Policy" data-ar="سياسة الخصوصية">Privacy Policy</a>
    <a href="./contact.html" data-en="Contact" data-ar="اتصل بنا">Contact</a>
  </nav>
  <div>© <span id="yr"></span> LiveRadio</div>
</footer>

<script>
var lang=(function(){
  var s=null;try{s=localStorage.getItem('lr_lang');}catch(e){}
  if(s==='ar'||s==='en')return s;
  var ls=[];try{ls=[navigator.language||''].concat(navigator.languages||[]);}catch(e){}
  for(var i=0;i<ls.length;i++){if((ls[i]||'').toLowerCase().indexOf('ar')===0)return 'ar';}
  return 'en';
})();
var posts=[],filter='';
function $(id){return document.getElementById(id);}

function applyStatic(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  var els=document.querySelectorAll('[data-en]');
  for(var i=0;i<els.length;i++){var v=els[i].getAttribute('data-'+lang);if(v)els[i].innerHTML=v;}
  $('langBtn').textContent=lang==='en'?'العربية':'English';
  try{localStorage.setItem('lr_lang',lang);}catch(e){}
}
$('langBtn').onclick=function(){lang=lang==='en'?'ar':'en';applyStatic();draw();};
$('yr').textContent=new Date().getFullYear();

function fmtDate(d){
  try{return new Date(d).toLocaleDateString(lang==='ar'?'ar':'en-GB',
    {year:'numeric',month:'long',day:'numeric'});}catch(e){return d;}
}
function drawChips(){
  var tags=[],seen={};
  posts.forEach(function(p){var t=p.tag.en;if(!seen[t]){seen[t]=p.tag;tags.push(t);}});
  var c=$('chips');c.innerHTML='';
  var allB=document.createElement('button');
  allB.className='chip'+(filter===''?' on':'');
  allB.textContent=lang==='ar'?'الكل':'All';
  allB.onclick=function(){filter='';draw();};
  c.appendChild(allB);
  tags.forEach(function(t){
    var b=document.createElement('button');
    b.className='chip'+(filter===t?' on':'');
    b.textContent=seen[t][lang]||t;
    b.onclick=function(){filter=t;draw();};
    c.appendChild(b);
  });
}
function draw(){
  drawChips();
  var l=$('list');l.innerHTML='';
  var items=posts.filter(function(p){return !filter||p.tag.en===filter;});
  items.sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  $('empty').style.display=items.length?'none':'block';
  items.forEach(function(p){
    var a=document.createElement('a');
    a.className='art';a.href='./articles/'+p.slug+'.html';
    a.innerHTML='<div class="tag"></div><h2></h2><p></p><div class="d"></div>';
    a.querySelector('.tag').textContent=p.tag[lang]||p.tag.en;
    a.querySelector('h2').textContent=p.title[lang]||p.title.en;
    a.querySelector('p').textContent=p.desc[lang]||p.desc.en;
    a.querySelector('.d').textContent=fmtDate(p.date);
    l.appendChild(a);
  });
}
applyStatic();
fetch('./articles.json').then(function(r){return r.json();})
  .then(function(d){posts=d||[];draw();})
  .catch(function(){$('empty').style.display='block';});
</script>
</body>
</html>
