<style>
:root{
  --bg:#e4ecf7; --bg2:#dbe6f6;
  --card:#f1f6fd; --card2:#dde8f8; --line:#c4d4ea;
  --txt:#0f1a2e; --mut:#4f5f7c; --acc:#0d8c82; --acc2:#5247d6;
  --shadow:rgba(16,32,66,.13);
  --headG:linear-gradient(120deg,#cfe2ff 0%,#ddd8fa 46%,#fbd9e8 100%);
  --footG:linear-gradient(120deg,#fbd9e8 0%,#ddd8fa 52%,#cfe2ff 100%);
  --cardG:linear-gradient(170deg,#f4f8fe 0%,#e3ecfa 100%);
  --heroG:linear-gradient(180deg,rgba(207,226,255,.75) 0%,rgba(228,236,247,0) 100%);
  --font:'Outfit','Cairo',system-ui,sans-serif;box-sizing:border-box;
}
html[data-theme="dark"]{
  --bg:#0b0f1a; --bg2:#0a0e18; --card:#161d31; --card2:#1c2440; --line:#232c45;
  --txt:#eef2ff; --mut:#93a0c0; --acc:#22d3a6; --acc2:#6366f1;
  --shadow:rgba(0,0,0,.35);
  --headG:linear-gradient(120deg,#0e1526,#121a2e 60%,#17132a);
  --footG:linear-gradient(120deg,#17132a,#121a2e 48%,#0e1526);
  --cardG:linear-gradient(170deg,#161d31,#141b2d);
  --heroG:linear-gradient(180deg,rgba(23,19,42,.65) 0%,rgba(11,15,26,0) 100%);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;height:100%;overflow-x:hidden;max-width:100%}
body{margin:0;min-height:100%;overflow-x:hidden;max-width:100%;color:var(--txt);font-family:var(--font);
  background:var(--bg);background-image:linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Cairo',var(--font)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
header{position:sticky;top:0;z-index:30;background:var(--headG);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);backdrop-filter:blur(10px)}
.hrow{display:flex;align-items:center;gap:8px;padding:12px 16px;max-width:1000px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.logo img{height:30px;width:auto;max-width:112px;object-fit:contain;display:block;border-radius:7px}
@media(min-width:620px){.logo img{height:34px;max-width:140px}}
#langBtn{font-size:13px;padding:0 13px}
@media(max-width:420px){
  .hrow{gap:5px;padding:10px 12px}
  .logo{font-size:17px}.logo img{height:26px;max-width:88px}
  .btn{height:34px;padding:0 11px;font-size:12.5px}
  .ibtn{width:34px;height:34px;font-size:14px;padding:0}
}
.logo-dot{width:11px;height:11px;border-radius:50%;background:var(--acc)}
.logo span{color:var(--acc)}
.spacer{flex:1}
.btn{background:var(--cardG);border:1px solid var(--line);color:var(--txt);
  display:inline-flex;align-items:center;justify-content:center;
  height:38px;padding:0 14px;border-radius:999px;font-size:13.5px;font-weight:700;
  cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px var(--shadow);line-height:1}
.btn:hover{border-color:var(--acc)}
.ibtn{width:38px;height:38px;border-radius:50%;padding:0;font-size:15px}

.herowrap{background:var(--heroG);border-bottom:1px solid var(--line)}
main{max-width:1000px;margin:0 auto;padding:0 16px 60px}
.mhero{text-align:center;padding:30px 8px 24px}
.mhero h1{font-size:clamp(26px,6.5vw,40px);margin:0 0 10px;font-weight:800;line-height:1.2;
  background:linear-gradient(100deg,var(--acc),var(--acc2) 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.mhero p{color:var(--mut);margin:0 auto 14px;max-width:620px;font-size:15.5px;line-height:1.65}
.mstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.mstats b{color:var(--acc);font-size:15px}

.sec{margin:18px 0;padding:18px;border-radius:18px;contain:layout;background:var(--cardG);
  border:1px solid var(--line);box-shadow:0 2px 10px var(--shadow)}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{font-size:18px;margin:0;font-weight:800;color:var(--acc2)}
.cnt{font-size:12.5px;color:var(--mut);font-weight:600}

.searchbox input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  padding:13px 16px;border-radius:14px;font-family:inherit;font-size:15px;outline:none;box-shadow:0 1px 3px var(--shadow)}
.searchbox input:focus{border-color:var(--acc)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 16px;
  border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 1px 2px var(--shadow)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.chip .n{opacity:.75;font-weight:600;font-size:12px}

.feat{display:block;border-radius:18px;overflow:hidden;border:1px solid var(--line);
  background:var(--cardG);box-shadow:0 4px 16px var(--shadow);transition:.2s}
.feat:hover{border-color:var(--acc);transform:translateY(-2px)}
.feat .band{height:120px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
.feat .band .wav{display:flex;gap:5px;align-items:flex-end;height:52px}
.feat .band .wav i{width:7px;background:rgba(255,255,255,.9);border-radius:4px;display:block;animation:w 1.4s ease-in-out infinite}
.feat .band .wav i:nth-child(1){height:20px}.feat .band .wav i:nth-child(2){height:40px;animation-delay:.15s}
.feat .band .wav i:nth-child(3){height:52px;animation-delay:.3s}.feat .band .wav i:nth-child(4){height:32px;animation-delay:.45s}
.feat .band .wav i:nth-child(5){height:46px;animation-delay:.6s}
@keyframes w{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.feat .body{padding:18px}
.feat .tag{font-size:11.5px;color:var(--acc);font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.feat h3{margin:8px 0 8px;font-size:20px;font-weight:800;line-height:1.3}
.feat p{margin:0;color:var(--mut);font-size:14px;line-height:1.6}

/* ===== الشريط المتحرك ===== */
.marq{position:relative;overflow:hidden;direction:ltr;margin:0 -16px;padding:4px 0;min-height:118px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.track{display:flex;gap:12px;width:max-content;direction:ltr;
  animation:slide 60s linear infinite;will-change:transform}
.marq:hover .track,.marq:active .track{animation-play-state:paused}
.marq.rev .track{animation-direction:reverse}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}}
.mcard{flex:0 0 260px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;box-shadow:0 2px 8px var(--shadow);display:block}
.mcard:hover{border-color:var(--acc)}
.mcard .t{font-size:11px;color:var(--acc);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.mcard .h{font-size:14.5px;font-weight:700;line-height:1.4;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcard .d{font-size:11px;color:var(--mut);margin-top:6px}

.arts{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));min-height:460px}
@media(min-width:620px){.arts{min-height:320px}}
.art{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;
  transition:.2s;display:block;box-shadow:0 2px 8px var(--shadow);position:relative}
.art:hover{border-color:var(--acc);transform:translateY(-2px);box-shadow:0 6px 18px var(--shadow)}
.art .tag{font-size:11.5px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.art h3{margin:8px 0 6px;font-size:16.5px;font-weight:700;line-height:1.35}
.art p{margin:0 0 10px;color:var(--mut);font-size:13.5px;line-height:1.55}
.art .d{font-size:11.5px;color:var(--mut)}
.art.has-thumb{padding:0;overflow:hidden}
.art .thumb{width:100%;height:150px;object-fit:cover;display:block;background:var(--card2)}
.art .inner{padding:15px}
.art .rd{position:absolute;inset-inline-end:14px;top:14px;font-size:11px;color:var(--mut);
  background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.pbar{height:4px;background:var(--card2);border-radius:3px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}

.empty{color:var(--mut);padding:26px 0;text-align:center}
.moreb{display:block;width:100%;margin-top:16px;padding:14px;border-radius:14px;
  border:1px solid var(--line);cursor:pointer;font-family:inherit;font-size:15px;font-weight:800;
  color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px var(--shadow)}
.moreb:hover{filter:brightness(1.07)}
footer{border-top:1px solid var(--line);margin-top:30px;padding:26px 16px;text-align:center;
  color:var(--mut);font-size:14px;background:var(--footG)}
footer nav{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:12px}
footer nav a:hover{color:var(--acc)}
#top{position:fixed;inset-inline-end:16px;bottom:24px;z-index:40;width:42px;height:42px;border-radius:50%;
  background:var(--cardG);border:1px solid var(--line);color:var(--txt);cursor:pointer;display:none;
  place-items:center;font-size:18px;box-shadow:0 4px 12px var(--shadow)}
</style>
<script>
(function(){
  var t='light';
  try{var v=JSON.parse(localStorage.getItem('lr_theme'));if(v==='dark'||v==='light')t=v;}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
})();
</script>

<main>
  <div class="sec" id="newSec">
    <div class="sechead"><h2 data-en="Latest" data-ar="أحدث المقالات">Latest</h2></div>

  <div class="sec" id="popSec" style="display:none">

  <div class="sec">
    <div class="sechead">
      <h2 id="listTitle" data-en="All articles" data-ar="كل المقالات">All articles</h2>

<footer>
  <nav>
    <a href="./" data-en="Home" data-ar="الرئيسية">Home</a>
    <a href="./about.html" data-en="About" data-ar="من نحن">About</a>
    <a href="./privacy.html" data-en="Privacy Policy" data-ar="سياسة الخصوصية">Privacy Policy</a>
    <a href="./contact.html" data-en="Contact" data-ar="اتصل بنا">Contact</a>
  </nav>
  <div>© <span id="yr"></span> LiveRadio</div>
</footer>
<button id="top" title="Top">&#8593;</button>
<script>
var lang=(function(){
  var s=null;try{s=localStorage.getItem('lr_lang');}catch(e){}
  if(s==='ar'||s==='en')return s;
  var ls=[];try{ls=[navigator.language||''].concat(navigator.languages||[]);}catch(e){}
  for(var i=0;i<ls.length;i++){if((ls[i]||'').toLowerCase().indexOf('ar')===0)return 'ar';}
  return 'en';
})();
function $(id){return document.getElementById(id);}
$('yr').textContent=new Date().getFullYear();

var theme=(function(){try{var v=JSON.parse(localStorage.getItem('lr_theme'));return (v==='dark'||v==='light')?v:'light';}catch(e){return 'light';}})();
function applyTheme(){
  document.documentElement.setAttribute('data-theme',theme);
  $('themeBtn').innerHTML=theme==='dark'?'&#9728;':'&#9789;';
  try{localStorage.setItem('lr_theme',JSON.stringify(theme));}catch(e){}
}
$('themeBtn').onclick=function(){theme=theme==='dark'?'light':'dark';applyTheme();};

var L={
 en:{all:'All',allArts:'All articles',in:'in',min:'min read',results:'{n} results',
     searchP:'Search articles...',langBtn:'Arabic',resume:'{p}% read',none:'Nothing found.',
     more:'Discover more ({n}) \u2192'},
 ar:{all:'الكل',allArts:'كل المقالات',in:'في',min:'دقيقة قراءة',results:'{n} نتيجة',
     searchP:'ابحث في المقالات...',langBtn:'إنجليزي',resume:'قرأت {p}%',none:'لا نتائج.',
     more:'اكتشف المزيد ({n}) \u2190'}
};
function T(k){var v=L[lang][k];return (v===undefined)?(L.en[k]||''):v;}

var posts=[],cats=[],stats=null,cfg=null,cat='',q='';

function fmtDate(d){
  try{return new Date(d).toLocaleDateString(lang==='ar'?'ar':'en-GB',
    {year:'numeric',month:'long',day:'numeric'});}catch(e){return d;}
}
function catName(k){
  for(var i=0;i<cats.length;i++)if(cats[i].k===k)return (lang==='ar'?cats[i].ar:cats[i].en);
  return k;
}
function progOf(slug){
  try{var o=JSON.parse(localStorage.getItem('lr_read')||'{}');return o[slug]||0;}catch(e){return 0;}
}

function cardOf(p,showProg){
  var a=document.createElement('a');a.className='art';
  a.href='./articles/'+p.slug+'.html';
  var pr=progOf(p.slug);
  var views=(stats&&stats[p.slug])?Number(stats[p.slug]).toLocaleString('en-US'):'';
  var meta=fmtDate(p.date)+(views?(' · '+views+' '+(lang==='ar'?'مشاهدة':'views')):'');
  if(p.thumb){
    a.className='art has-thumb';
    a.innerHTML='<img class="thumb" loading="lazy" alt="">'+
      '<div class="inner"><div class="tag"></div><h3></h3><p></p><div class="d"></div></div>';
    var im=a.querySelector('.thumb');
    im.src=p.thumb; im.alt=p.title[lang]||p.title.en;
    im.onerror=function(){ this.style.display='none'; };
  }else{
    a.innerHTML='<div class="tag"></div><h3></h3><p></p><div class="d"></div>';
  }
  a.querySelector('.tag').textContent=catName(p.cat||'');
  a.querySelector('h3').textContent=p.title[lang]||p.title.en;
  a.querySelector('p').textContent=p.desc[lang]||p.desc.en;
  a.querySelector('.d').textContent=meta;
  if(views && !p.thumb){
    var rd=document.createElement('div');rd.className='rd';rd.textContent=views;
    a.appendChild(rd);
  }
  if(showProg&&pr>3&&pr<97){
    var bar=document.createElement('div');bar.className='pbar';
    bar.innerHTML='<i style="width:'+pr+'%"></i>';
    a.appendChild(bar);
    var t=document.createElement('div');t.className='d';t.style.marginTop='6px';
    t.textContent=T('resume').replace('{p}',pr);
    a.appendChild(t);
  }
  return a;
}

/* شريط أحدث المقالات: ينزلق تلقائياً ويتوقف عند اللمس */
function drawMarquee(){
  var sec=$('newSec'),box=$('track'),m=$('marq');
  if(!box||!posts.length)return;
  var latest=posts.slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'');}).slice(0,10);
  if(!latest.length){sec.style.display='none';return;}
  box.innerHTML='';
  /* نسختان متتاليتان ليبدو الانزلاق بلا نهاية */
  for(var pass=0;pass<2;pass++){
    latest.forEach(function(p){
      var a=document.createElement('a');a.className='mcard';
      a.dir=(lang==='ar')?'rtl':'ltr';
      a.href='./articles/'+p.slug+'.html';
      if(pass)a.setAttribute('aria-hidden','true');
      a.innerHTML='<div class="t"></div><div class="h"></div><div class="d"></div>';
      a.querySelector('.t').textContent=catName(p.cat||'');
      a.querySelector('.h').textContent=p.title[lang]||p.title.en;
      a.querySelector('.d').textContent=fmtDate(p.date);
      box.appendChild(a);
    });
  }
  /* الشريط يُرتَّب دائماً من اليسار ليبقى الفيض في جهة واحدة،
     والاتجاه المرئي يُضبط بعكس الحركة، ونص كل بطاقة يأخذ اتجاه لغته */
  m.style.direction='ltr';
  box.style.direction='ltr';
  m.classList.toggle('rev',lang==='ar');
  sec.style.display='block';
  /* السرعة تُحسب بعد الرسم حتى يكون العرض الحقيقي معروفاً */
  requestAnimationFrame(function(){
    var w=box.scrollWidth/2;
    if(!w)return;
    box.style.animationDuration=Math.max(24,Math.round(w/60))+'s';
  });
}

function drawCats(){
  var box=$('cats');box.innerHTML='';
  function chip(k,label,n){
    var b=document.createElement('button');
    b.className='chip'+(cat===k?' on':'');
    b.innerHTML=label+' <span class="n">'+n+'</span>';
    b.onclick=function(){cat=k;shown=10;drawCats();drawList();};
    box.appendChild(b);
  }
  chip('',T('all'),posts.length);
  cats.forEach(function(c){
    var n=posts.filter(function(p){return p.cat===c.k;}).length;
    if(!n&&cat!==c.k)return;          /* تصنيف بلا مقالات لا يُعرض */
    chip(c.k,(lang==='ar'?c.ar:c.en),n);
  });
}

function filtered(){
  var s=q.trim().toLowerCase();
  return posts.filter(function(p){
    if(cat&&p.cat!==cat)return false;
    if(!s)return true;
    var hay=((p.title.en||'')+' '+(p.title.ar||'')+' '+(p.desc.en||'')+' '+
             (p.desc.ar||'')+' '+p.slug).toLowerCase();
    return hay.indexOf(s)>-1;
  }).sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
}

var shown=10;
function drawList(){
  var items=filtered();
  $('listTitle').textContent = cat? catName(cat) : T('allArts');
  $('listCnt').textContent=T('results').replace('{n}',items.length);
  var box=$('list');box.innerHTML='';
  items.slice(0,shown).forEach(function(p){box.appendChild(cardOf(p,false));});
  $('empty').style.display=items.length?'none':'block';
  $('empty').textContent=T('none');
  var mb=$('moreb');
  if(items.length>shown){
    mb.style.display='block';
    mb.textContent=T('more').replace('{n}',items.length-shown);
  }else mb.style.display='none';
}
$('moreb').onclick=function(){shown+=10;drawList();};

function drawFeatured(){
  if(!posts.length)return;
  var slug=(cfg&&cfg.featuredArticle)||'';
  var p=null;
  if(slug)for(var i=0;i<posts.length;i++)if(posts[i].slug===slug){p=posts[i];break;}
  if(!p){
    var sorted=posts.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
    p=sorted[0];
  }
  if(!p)return;
  var a=document.createElement('a');a.className='feat';a.href='./articles/'+p.slug+'.html';
  var band = p.thumb
    ? '<img class="band" src="'+p.thumb+'" alt="" style="width:100%;height:170px;object-fit:cover;display:block">'
    : '<div class="band"><div class="wav"><i></i><i></i><i></i><i></i><i></i></div></div>';
  a.innerHTML=band+'<div class="body"><div class="tag"></div><h3></h3><p></p></div>';
  a.querySelector('.tag').textContent=catName(p.cat||'');
  a.querySelector('h3').textContent=p.title[lang]||p.title.en;
  a.querySelector('p').textContent=p.desc[lang]||p.desc.en;
  $('featBox').innerHTML='';$('featBox').appendChild(a);
  $('featSec').style.display='block';
}

function drawPopular(){
  if(!posts.length)return;
  var order=(cfg&&cfg.popular&&cfg.popular.length)?cfg.popular:null;
  if(!order&&stats)
    order=Object.keys(stats).sort(function(a,b){return stats[b]-stats[a];}).slice(0,3);
  if(!order||!order.length){$('popSec').style.display='none';return;}
  var box=$('popList');box.innerHTML='';var n=0;
  order.slice(0,3).forEach(function(slug){
    for(var i=0;i<posts.length;i++)if(posts[i].slug===slug){box.appendChild(cardOf(posts[i],false));n++;break;}
  });
  $('popSec').style.display=n?'block':'none';
}

function drawContinue(){
  var o={};try{o=JSON.parse(localStorage.getItem('lr_read')||'{}');}catch(e){}
  var list=[];
  posts.forEach(function(p){
    var v=o[p.slug]||0;
    if(v>3&&v<97)list.push(p);
  });
  if(!list.length){$('contSec').style.display='none';return;}
  var box=$('contList');box.innerHTML='';
  list.slice(0,3).forEach(function(p){box.appendChild(cardOf(p,true));});
  $('contSec').style.display='block';
}

function drawBrandFooter(){
  if(!cfg)return;
  var mark=(cfg.logo&&cfg.logo.length>4)?'<img src="'+cfg.logo+'" alt="">':'<span class="logo-dot"></span>';
  var b=$('brand');
  if(b)b.innerHTML=mark+((cfg.brand&&cfg.brand.name1)||'Live')+
      '<span>'+((cfg.brand&&cfg.brand.name2)||'Radio')+'</span>';
  var nav=document.querySelector('footer nav');
  if(nav&&cfg.footer&&cfg.footer.length){
    nav.innerHTML='';
    cfg.footer.forEach(function(it){
      if(!it||!it.href)return;
      var a=document.createElement('a');a.href=it.href;
      a.textContent=(lang==='ar'?(it.ar||it.en):(it.en||it.ar))||'';
      nav.appendChild(a);
    });
  }
}
function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  var els=document.querySelectorAll('[data-en]');
  for(var i=0;i<els.length;i++){
    var v=els[i].getAttribute('data-'+lang);if(v)els[i].innerHTML=v;
  }
  $('q').placeholder=T('searchP');
  $('langBtn').textContent=T('langBtn');
  drawBrandFooter();drawMarquee();drawCats();drawList();drawFeatured();drawPopular();drawContinue();
  try{localStorage.setItem('lr_lang',lang);}catch(e){}
}
$('langBtn').onclick=function(){lang=lang==='en'?'ar':'en';applyLang();};
$('q').oninput=function(){q=this.value;shown=10;drawList();};

var topBtn=$('top');
window.addEventListener('scroll',function(){topBtn.style.display=window.scrollY>500?'grid':'none';});
topBtn.onclick=function(){window.scrollTo({top:0,behavior:'smooth'});};

applyTheme();

Promise.all([
  fetch('./articles.json').then(function(r){return r.json();}).catch(function(){return [];}),
  fetch('./site.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
  fetch('./stats.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
]).then(function(res){
  posts=res[0]||[];cfg=res[1];stats=res[2];
  if(cfg&&cfg.colors){
    var st=document.createElement('style');
    function blk(sel,o){if(!o)return '';var t=sel+'{';for(var k in o){if(o[k])t+='--'+k+':'+o[k]+';';}return t+'}';}
    st.textContent=blk(':root',cfg.colors.light)+blk('html[data-theme="dark"]',cfg.colors.dark);
    document.head.appendChild(st);
  }
  cats=(cfg&&cfg.cats&&cfg.cats.length)?cfg.cats:(function(){
    var seen={},out=[];
    posts.forEach(function(p){
      var k=p.cat||'';if(!k||seen[k])return;seen[k]=1;
      out.push({k:k,en:(p.tag&&p.tag.en)||k,ar:(p.tag&&p.tag.ar)||k});
    });
    return out;
  })();
  $('nArts').textContent=posts.length;
  $('nCats').textContent=cats.length||6;
  var last=posts.slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');})[0];
  $('lastUp').textContent=last?fmtDate(last.date):'—';
  applyLang();
});
</script>
</body>
</html>
