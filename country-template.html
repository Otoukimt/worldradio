<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{en}} Radio Online — Live Stations | LiveRadio</title>
<!-- ضع هنا نفس أكواد الـ meta والـ CSS الخاصة بك كما في صفحة أمريكا -->
</head>
<body>
<main data-type="country" data-cc="{{cc}}" data-slug="{{slug}}">
  <div class="chead">
    <div class="fg" id="flag">🌐</div>
    <h1 data-en="{{en}} radio online" data-ar="إذاعات {{ar}} مباشرة">{{en}} radio online</h1>
    <div class="sub"><span id="cnt">—</span> · <span data-en="updated {{date}}" data-ar="تحديث {{date}}">updated {{date}}</span></div>
  </div>

  <div class="sec">
    <h2 data-en="Live stations" data-ar="المحطات المباشرة">Live stations</h2>
    <div class="catbar" id="catbar"></div>
    <div id="body"></div>
    <div class="load" id="status">Loading…</div>
  </div>

  <!-- هذا القسم سيختفي أوتوماتيكياً إذا لم تكن هناك مقالة جاهزة -->
  <div class="sec" id="aboutSec">
    <h2 data-en="About radio in {{en}}" data-ar="عن الإذاعة في {{ar}}">About radio in {{en}}</h2>
    <div class="lang-en" id="inEn">{{descEn}}</div>
    <div class="lang-ar" id="inAr">{{descAr}}</div>
  </div>
</main>
<!-- ضع هنا سكربت الجافاسكريبت الخاص بصفحة الدولة، مع تغيير السطر الأول فقط ليكون: -->
<script>
var CC='{{cc}}', SLUG='{{slug}}';
// ... بقية السكربت
</script>
</body>
</html>
