<style>
:root{--bg:#e4ecf7;--bg2:#dbe6f6;--card:#f1f6fd;--card2:#dde8f8;--line:#c4d4ea;
--txt:#0f1a2e;--mut:#4f5f7c;--acc:#0d8c82;--acc2:#5247d6;--shadow:rgba(16,32,66,.13);
--headG:linear-gradient(120deg,#cfe2ff 0%,#ddd8fa 46%,#fbd9e8 100%);
--footG:linear-gradient(120deg,#fbd9e8 0%,#ddd8fa 52%,#cfe2ff 100%);
--cardG:linear-gradient(170deg,#f4f8fe 0%,#e3ecfa 100%);
--font:'Outfit','Cairo',system-ui,sans-serif;box-sizing:border-box}
html[data-theme="dark"]{--bg:#0b0f1a;--bg2:#0a0e18;--card:#161d31;--card2:#1c2440;--line:#232c45;
--txt:#eef2ff;--mut:#93a0c0;--acc:#22d3a6;--acc2:#6366f1;--shadow:rgba(0,0,0,.35);
--headG:linear-gradient(120deg,#0e1526,#121a2e 60%,#17132a);
--footG:linear-gradient(120deg,#17132a,#121a2e 48%,#0e1526);
--cardG:linear-gradient(170deg,#161d31,#141b2d)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;height:100%;overflow-x:hidden;max-width:100%}
body{margin:0;min-height:100%;overflow-x:hidden;max-width:100%;color:var(--txt);font-family:var(--font);
background:var(--bg);background-image:linear-gradient(180deg,var(--bg),var(--bg2));
background-attachment:fixed;padding-top:env(safe-area-inset-top,0px);
padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Cairo',var(--font)}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
header{position:sticky;top:0;z-index:30;background:var(--headG);border-bottom:1px solid var(--line);
padding-top:env(safe-area-inset-top,0px);backdrop-filter:blur(10px)}
.hrow{display:flex;align-items:center;gap:7px;padding:12px 16px;max-width:1000px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px}
.logo-dot{width:11px;height:11px;border-radius:50%;background:var(--acc)}
.logo span{color:var(--acc)}
.spacer{flex:1}
.btn,.navrow a{background:var(--cardG);border:1px solid var(--line);color:var(--txt);
display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 15px;
border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
box-shadow:0 1px 3px var(--shadow);line-height:1;font-family:inherit}
.btn:hover,.navrow a:hover{border-color:var(--acc);color:var(--acc)}
@media(max-width:420px){.btn,.navrow a{height:34px;padding:0 12px;font-size:12.5px}}
main{max-width:1000px;margin:0 auto;padding:0 16px 60px;position:relative;
overflow-x:clip}
.cbanner{position:absolute;left:0;right:0;top:-60px;height:470px;z-index:0;
overflow:hidden;pointer-events:none;user-select:none;
display:flex;justify-content:center;align-items:flex-start;gap:0;
filter:blur(36px) saturate(1.6);opacity:.78;
-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 32%,rgba(0,0,0,.45) 64%,transparent 100%);
mask-image:linear-gradient(180deg,#000 0%,#000 32%,rgba(0,0,0,.45) 64%,transparent 100%)}
.cbanner i{font-style:normal;font-size:230px;line-height:1;flex:none}
@media(max-width:620px){.cbanner{top:-48px;height:370px}.cbanner i{font-size:150px}}
html[data-theme="dark"] .cbanner{opacity:.5;filter:blur(40px) saturate(1.25) brightness(.8)}
main>*:not(.cbanner){position:relative;z-index:1}
header{background:transparent;backdrop-filter:blur(16px) saturate(1.25);width:100%}
.chead{text-align:center;padding:28px 10px 18px}
.chead .fg{font-size:62px;line-height:1}
.chead h1{font-size:clamp(25px,6vw,36px);margin:10px 0 8px;font-weight:800;
background:linear-gradient(100deg,var(--acc),var(--acc2) 70%);
-webkit-background-clip:text;background-clip:text;color:transparent}
.chead .sub{color:var(--mut);font-size:14px}
.sec{margin:16px 0;padding:18px;border-radius:18px;contain:layout;background:var(--cardG);
border:1px solid var(--line);box-shadow:0 2px 10px var(--shadow)}
.sec h2{font-size:19px;margin:0 0 12px;font-weight:800;color:var(--acc2)}
.sec p{line-height:1.85;font-size:16px;margin:0 0 14px;opacity:.93}
.sec ul{line-height:1.85;font-size:16px;padding-inline-start:22px}
.navrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;justify-content:center;padding-top:12px}
.catbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;min-height:46px}
.catbar::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);padding:8px 15px;
border-radius:999px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.grid{display:grid;gap:16px 8px;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));min-height:240px}
.st{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;
padding:3px;color:inherit;cursor:pointer}
.ring{width:72px;height:72px;border-radius:50%;padding:3px;background:var(--card2);
display:grid;place-items:center;box-shadow:0 2px 8px var(--shadow)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--card);display:block}
.ring .fb{width:100%;height:100%;border-radius:50%;background:var(--card);display:grid;
place-items:center;font-size:21px;font-weight:800;color:var(--acc)}
.st .nm{font-size:12px;font-weight:600;text-align:center;line-height:1.3;max-width:98px;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st .br{font-size:10px;color:var(--mut)}
.grouphead{font-size:15px;font-weight:800;margin:16px 0 10px;color:var(--acc2)}
.load{text-align:center;color:var(--mut);padding:22px 0;font-size:14px}
.arts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;display:block}
.rcard:hover{border-color:var(--acc)}
.rcard .t{font-size:11.5px;color:var(--acc);font-weight:700;text-transform:uppercase}
.rcard .h{font-size:15px;font-weight:700;margin-top:6px;line-height:1.35}
footer{border-top:1px solid var(--line);margin-top:26px;padding:26px 16px;text-align:center;
color:var(--mut);font-size:14px;background:var(--footG)}
footer nav{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:12px}
.lang-ar{display:none}
</style>
<script>
(function(){
  var t='light';
  try{var v=JSON.parse(localStorage.getItem('lr_theme'));if(v==='dark'||v==='light')t=v;}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
</head>
<body>

<header>
  <div class="hrow">
    <a class="logo" href="../"><span class="logo-dot"></span>Live<span>Radio</span></a>
    <div class="spacer"></div>
    <a class="btn" href="../" data-en="&larr; Stations" data-ar="&rarr; المحطات">&larr; Stations</a>
    <button class="btn" id="langBtn">Arabic</button>
  </div>
</header>

<main data-type="country" data-cc="GR" data-slug="greece">
  <div class="cbanner" aria-hidden="true" id="cbanner"></div>
  <div class="navrow">
    <a href="../" data-en="&larr; Home" data-ar="&rarr; الرئيسية">&larr; Home</a>
    <a href="../articles.html" data-en="Articles" data-ar="المقالات">Articles</a>
  </div>

  <div class="chead">
    <div class="fg" id="flag">🌐</div>
    <h1 data-en="Greece radio online" data-ar="إذاعات اليونان مباشرة">Greece radio online</h1>
    <div class="sub"><span id="cnt">—</span> · <span data-en="updated 2026-11-10" data-ar="تحديث 2026-11-10">updated 2026-11-10</span></div>
  </div>

  <div class="sec">
    <h2 data-en="Live stations" data-ar="المحطات المباشرة">Live stations</h2>
    <div class="catbar" id="catbar"></div>
    <div id="body"></div>
    <div class="load" id="status">Loading…</div>
  </div>

  <div class="sec" id="aboutSec" style="display:none">
    <h2 data-en="About radio in Greece" data-ar="عن الإذاعة في اليونان">About radio in Greece</h2>
    <div class="lang-en" id="inEn"></div>
    <div class="lang-ar" id="inAr"></div>
  </div>

  <div class="sec" id="relSec" style="display:none">
    <h2 data-en="Read more" data-ar="اقرأ أيضاً">Read more</h2>
    <div class="arts" id="relGrid"></div>
  </div>
</main>

<footer>
  <nav>
    <a href="../" data-en="Home" data-ar="الرئيسية">Home</a>
    <a href="../articles.html" data-en="Articles" data-ar="المقالات">Articles</a>
    <a href="../about.html" data-en="About" data-ar="من نحن">About</a>
    <a href="../privacy.html" data-en="Privacy Policy" data-ar="سياسة الخصوصية">Privacy</a>
    <a href="../contact.html" data-en="Contact" data-ar="اتصل بنا">Contact</a>
  </nav>
  <div>&copy; <span id="yr"></span> LiveRadio</div>
</footer>

<script>
var CC='GR', SLUG='greece';
var lang=(function(){
  var s=null;try{s=localStorage.getItem('lr_lang');}catch(e){}
  if(s==='ar'||s==='en')return s;
  var ls=[];try{ls=[navigator.language||''].concat(navigator.languages||[]);}catch(e){}
  for(var i=0;i<ls.length;i++){if((ls[i]||'').toLowerCase().indexOf('ar')===0)return 'ar';}
  return 'en';
})();
function $(id){return document.getElementById(id);}
$('yr').textContent=new Date().getFullYear();
var FLAG='🌐';
try{FLAG=String.fromCodePoint(0x1F1E6+CC.charCodeAt(0)-65,0x1F1E6+CC.charCodeAt(1)-65);}catch(e){}
$('flag').textContent=FLAG;
(function(){
  var b=$('cbanner');
  if(!b)return;
  for(var i=0;i<3;i++){var e=document.createElement('i');e.textContent=FLAG;b.appendChild(e);}
})();

var G=[
 {k:'news',en:'News & talk',ar:'أخبار وحوار',m:['news','talk','info','politic']},
 {k:'music',en:'Music',ar:'موسيقى',m:['music','pop','rock','jazz','classical','dance','hiphop','hip hop','rap','chaabi','rai','variety','hits','oldies','folk']},
 {k:'relig',en:'Religious',ar:'ديني',m:['quran','islam','religio','christian','gospel','coran']},
 {k:'sport',en:'Sport',ar:'رياضة',m:['sport','football','soccer']},
 {k:'cult',en:'Culture',ar:'ثقافة',m:['culture','art','book','history','science','education']}
];
function grp(s){
  var t=((s.tags||'')+' '+(s.name||'')).toLowerCase();
  for(var i=0;i<G.length;i++)for(var j=0;j<G[i].m.length;j++)if(t.indexOf(G[i].m[j])>-1)return G[i].k;
  return 'other';
}
var M=['https://de2.api.radio-browser.info','https://nl1.api.radio-browser.info','https://at1.api.radio-browser.info'];
function api(p){
  return new Promise(function(resolve){
    var done=false,left=M.length;
    M.forEach(function(m){
      var ctl=null,t=null;
      try{ctl=new AbortController();}catch(e){}
      t=setTimeout(function(){if(ctl)try{ctl.abort();}catch(e){}},8000);
      fetch(m+p,ctl?{signal:ctl.signal}:undefined)
        .then(function(r){if(!r.ok)throw 0;return r.json();})
        .then(function(d){clearTimeout(t);if(!done){done=true;resolve(d);}})
        .catch(function(){clearTimeout(t);if(--left<=0&&!done){done=true;resolve(null);}});
    });
  });
}
function normUrl(u){return (u||'').toLowerCase().replace(/^https?:\/\//,'').replace(/[?#].*$/,'')
  .replace(/\/+$/,'').replace(/;+$/,'');}
var list=[],cat='',loading=true;
function card(s){
  var b=document.createElement('button');b.className='st';
  var r=document.createElement('div');r.className='ring';
  if(s.favicon&&s.favicon.indexOf('https')===0){
    var im=document.createElement('img');im.loading='lazy';im.decoding='async';
    im.src=s.favicon;im.alt=s.name;
    im.onerror=function(){var f=document.createElement('div');f.className='fb';
      f.textContent=(s.name||'?').charAt(0).toUpperCase();r.replaceChild(f,im);};
    r.appendChild(im);
  }else{var f=document.createElement('div');f.className='fb';
    f.textContent=(s.name||'?').charAt(0).toUpperCase();r.appendChild(f);}
  var n=document.createElement('div');n.className='nm';n.textContent=(s.name||'').trim();
  b.appendChild(r);b.appendChild(n);
  if(s.bitrate){var br=document.createElement('div');br.className='br';br.textContent=s.bitrate+' kbps';b.appendChild(br);}
  b.onclick=function(){location.href='../#s='+s.stationuuid;};
  b.title=(s.name||'');
  return b;
}
function bar(){
  var box=$('catbar');box.innerHTML='';
  var seen={};list.forEach(function(s){seen[grp(s)]=1;});
  var items=[{k:'',en:'All',ar:'الكل'}].concat(G.filter(function(g){return seen[g.k];}));
  if(seen['other'])items.push({k:'other',en:'Other',ar:'منوّعات'});
  items.forEach(function(c){
    var b=document.createElement('button');b.className='chip'+(cat===c.k?' on':'');
    b.textContent=(lang==='ar'?c.ar:c.en);
    b.onclick=function(){cat=c.k;bar();draw();};box.appendChild(b);
  });
}
function draw(){
  var body=$('body');body.innerHTML='';
  var sel=list.filter(function(s){return !cat||grp(s)===cat;});
  $('cnt').textContent=sel.length+' '+(lang==='ar'?'محطة':'stations');
  if(!sel.length){$('status').textContent=loading?(lang==='ar'?'جارٍ التحميل…':'Loading…')
    :(lang==='ar'?'لا محطات.':'No stations.');return;}
  $('status').textContent='';
  if(cat){
    var g=document.createElement('div');g.className='grid';
    sel.slice(0,120).forEach(function(s){g.appendChild(card(s));});body.appendChild(g);
  }else{
    G.concat([{k:'other',en:'Other',ar:'منوّعات'}]).forEach(function(gr){
      var sub=sel.filter(function(s){return grp(s)===gr.k;});
      if(!sub.length)return;
      var h=document.createElement('div');h.className='grouphead';
      h.textContent=(lang==='ar'?gr.ar:gr.en)+' · '+sub.length;body.appendChild(h);
      var g2=document.createElement('div');g2.className='grid';
      sub.slice(0,18).forEach(function(s){g2.appendChild(card(s));});body.appendChild(g2);
      if(sub.length>18){
        var mb=document.createElement('button');mb.className='chip';
        mb.style.cssText='margin:8px 0 4px';
        mb.textContent=(lang==='ar'?('عرض كل '+sub.length):('Show all '+sub.length));
        mb.onclick=function(){cat=gr.k;bar();draw();};
        body.appendChild(mb);
      }
    });
  }
}
function apply(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  var els=document.querySelectorAll('[data-en]');
  for(var i=0;i<els.length;i++){var v=els[i].getAttribute('data-'+lang);if(v)els[i].innerHTML=v;}
  var hasEn=($('inEn').textContent||'').trim().length>20;
  var hasAr=($('inAr').textContent||'').trim().length>20;
  var showEn=(lang==='en')?hasEn:(!hasAr&&hasEn);
  var showAr=(lang==='ar')?hasAr:(!hasEn&&hasAr);
  $('inEn').style.display=showEn?'block':'none';
  $('inAr').style.display=showAr?'block':'none';
  var ab=$('aboutSec');
  if(ab)ab.style.display=(showEn||showAr)?'block':'none';
  $('langBtn').textContent=(lang==='en')?'Arabic':'إنجليزي';
  bar();draw();
  try{localStorage.setItem('lr_lang',lang);}catch(e){}
}
$('langBtn').onclick=function(){lang=(lang==='en')?'ar':'en';apply();};

api('/json/stations/search?hidebroken=true&limit=250&order=clickcount&reverse=true&countrycode='+CC)
 .then(function(d){
   loading=false;
   var seen={};
   list=(d||[]).filter(function(s){
     var u=s.url_resolved||s.url||'';
     if(u.indexOf('https://')!==0||!s.name)return false;
     var k=normUrl(u);if(!k||seen[k])return false;seen[k]=1;return true;});
   apply();
 }).catch(function(){loading=false;$('status').textContent='—';});

fetch('../articles.json').then(function(r){return r.json();}).then(function(all){
  var pick=all.filter(function(p){return (p.cc||'').toUpperCase()===CC;});
  if(pick.length<3){
    var key=SLUG.replace(/-/g,' ').slice(0,6).toLowerCase();
    all.forEach(function(p){
      if(pick.length>=3)return;
      if((p.cc||'').toUpperCase()===CC)return;
      var hay=((p.title.en||'')+' '+(p.desc.en||'')+' '+p.slug).toLowerCase();
      if(key.length>3&&hay.indexOf(key)>-1)pick.push(p);
    });
  }
  if(!pick.length)pick=all.filter(function(p){return p.cat==='countries';}).slice(0,3);
  pick=pick.slice(0,4);
  if(!pick.length)return;
  var box=$('relGrid');
  pick.forEach(function(p){
    var a=document.createElement('a');a.className='rcard';a.href='../articles/'+p.slug+'.html';
    a.innerHTML='<div class="t"></div><div class="h"></div>';
    a.querySelector('.t').textContent=(p.tag&&(p.tag[lang]||p.tag.en))||'';
    a.querySelector('.h').textContent=p.title[lang]||p.title.en;
    box.appendChild(a);
  });
  $('relSec').style.display='block';
}).catch(function(){});

apply();
</script>
</body>
</html>
