name: Article Views

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: article-views
  cancel-in-progress: true

jobs:
  views:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read views from Google Analytics
        env:
          GA_KEY: ${{ secrets.GA_KEY }}
          GA_PROPERTY: ${{ secrets.GA_PROPERTY }}
        run: node ga-stats.js

      - name: Search Console, indexing, stations and speed
        continue-on-error: true
        env:
          GA_KEY: ${{ secrets.GA_KEY }}
          GA_PROPERTY: ${{ secrets.GA_PROPERTY }}
          PSI_KEY: ${{ secrets.PSI_KEY }}
        run: node insights.js

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "تحديث المشاهدات والرؤى"
          file_pattern: "stats.json site-stats.json insights.json"
