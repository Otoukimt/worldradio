name: Generate Country Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Build Script
        run: node build.js

      - name: Commit generated HTML files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "توليد صفحات الدول أوتوماتيكياً"
          file_pattern: "countries/*.html"
