<script>
var lang=(function(){
  var s=null;try{s=localStorage.getItem('lr_lang');}catch(e){}
  if(s==='ar'||s==='en')return s;
  var ls=[];try{ls=[navigator.language||''].concat(navigator.languages||[]);}catch(e){}
  for(var i=0;i<ls.length;i++){if((ls[i]||'').toLowerCase().indexOf('ar')===0)return 'ar';}
  return 'en';
})();
function apply(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  var els=document.querySelectorAll('[data-en]');
  for(var i=0;i<els.length;i++){var v=els[i].getAttribute('data-'+lang);if(v)els[i].innerHTML=v;}
  var le=document.querySelectorAll('.lang-en'),la=document.querySelectorAll('.lang-ar');
  for(var a=0;a<le.length;a++)le[a].style.display=(lang==='en')?'':'none';
  for(var b=0;b<la.length;b++)la[b].style.display=(lang==='ar')?'':'none';
  document.getElementById('langBtn').textContent=lang==='en'?'Arabic':'الإنجليزية';
  try{localStorage.setItem('lr_lang',lang);}catch(e){}
}
document.getElementById('langBtn').onclick=function(){lang=lang==='en'?'ar':'en';apply();};
document.getElementById('yr').textContent=new Date().getFullYear();
apply();
</script>
