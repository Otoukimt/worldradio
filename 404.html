<style>
:root{--bg:#0b0f1a;--card:#161d31;--line:#232c45;--txt:#eef2ff;--mut:#93a0c0;

*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:'Cairo',var(--font)}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit}
header{position:sticky;top:0;z-index:30;background:rgba(11,15,26,.93);backdrop-filter:blur(14px);
border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:760px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;color:var(--txt)}
.logo-dot{width:11px;height:11px;border-radius:50%;background:var(--acc)}
.logo span{color:var(--acc)}
.spacer{flex:1}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:8px 14px;
border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:26px 18px 60px}
h1{font-size:clamp(26px,6vw,36px);line-height:1.25;margin:0 0 20px;font-weight:800}
h2{font-size:21px;margin:32px 0 10px;font-weight:800}
p{line-height:1.8;color:#dbe2f7;margin:0 0 16px;font-size:16.5px}
ul{line-height:1.85;color:#dbe2f7;padding-inline-start:22px;margin:0 0 18px;font-size:16.5px}
li{margin-bottom:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:26px 0}
.box h2{margin-top:0;font-size:18px}
footer{border-top:1px solid var(--line);padding:26px 18px;text-align:center;color:var(--mut);font-size:14px}
footer nav{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:12px}
footer nav a{color:var(--mut)}
footer nav a:hover{color:var(--acc)}

.nf-air{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--mut);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:16px}
.nf-air i{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.nf-path{direction:ltr;display:inline-block;font-size:13px;color:var(--mut);background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:3px 8px;word-break:break-all;max-width:100%}
.nf-q{display:flex;gap:8px;margin:22px 0 8px}
.nf-q input{flex:1;min-width:0;background:var(--card);border:1.5px solid var(--line);color:var(--txt);border-radius:14px;
  padding:13px 14px;font:inherit;font-size:16px;outline:none}
.nf-q input:focus{border-color:var(--acc)}
.nf-q button{background:var(--acc);color:#fff;border:none;border-radius:14px;padding:0 18px;font:inherit;font-weight:700;cursor:pointer}
.nf-sug{margin-top:26px;display:none}
.nf-sug h2{font-size:17px;margin:0 0 10px}
.nf-list{display:grid;gap:8px}
.nf-list a{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;color:var(--txt);text-decoration:none;font-weight:600}
.nf-list a:hover{border-color:var(--acc)}
.nf-list .fl{font-size:22px;line-height:1}
.nf-list .sm{display:block;font-size:12.5px;color:var(--mut);font-weight:400;margin-top:2px}
.nf-go{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.nf-go a{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;color:var(--txt);
  text-decoration:none;font-weight:700;font-size:14px}
</style>

<style>
/* light theme is the default; dark is opt-in */
:root{
  --bg:#f3f6fc; --card:#ffffff; --card2:#eef3fc; --line:#dde5f2;
  --txt:#111a2e; --mut:#5a6880; --acc:#0d9488; --acc2:#5b53e0; --red:#e11d48;
  --shadow:rgba(23,38,74,.09);
  --headG:linear-gradient(120deg,#e8f1ff 0%,#eeeafd 48%,#fdeef4 100%);
  --footG:linear-gradient(120deg,#fdeef4 0%,#eeeafd 52%,#e8f1ff 100%);
  --cardG:linear-gradient(170deg,#ffffff 0%,#f6f9ff 100%);
}
html[data-theme="dark"]{
  --bg:#0b0f1a; --card:#161d31; --card2:#1c2440; --line:#232c45;
  --txt:#eef2ff; --mut:#93a0c0; --acc:#22d3a6; --acc2:#6366f1; --red:#f43f5e;
  --shadow:rgba(0,0,0,.35);
  --headG:linear-gradient(120deg,#0e1526,#121a2e 60%,#17132a);
  --footG:linear-gradient(120deg,#17132a,#121a2e 48%,#0e1526);
  --cardG:linear-gradient(170deg,#161d31,#141b2d);
}
body{background:var(--bg)}
header{background:var(--headG);backdrop-filter:blur(10px)}
footer{background:var(--footG)}
.btn{background:var(--cardG);box-shadow:0 1px 2px var(--shadow)}
.box,.art,.mail{background:var(--cardG);box-shadow:0 2px 8px var(--shadow)}
.chip{background:var(--cardG)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
th{background:var(--card2)}
code{background:var(--card2)}
p,ul,ol{color:var(--txt);opacity:.93}
.cta{color:#fff;box-shadow:0 6px 18px var(--shadow)}
</style>

<script>
(function(){
  var t='light';
  try{var v=JSON.parse(localStorage.getItem('lr_theme'));if(v==='dark'||v==='light')t=v;}catch(e){}
  document.documentElement.setAttribute('data-theme',t);
  var m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',t==='dark'?'#0e1526':'#eef3fb');
})();
</script>

<script>
var lang=(function(){
  var s=null;try{s=localStorage.getItem('lr_lang');}catch(e){}
  if(s==='ar'||s==='en')return s;
  var ls=[];try{ls=[navigator.language||''].concat(navigator.languages||[]);}catch(e){}
  for(var i=0;i<ls.length;i++){if((ls[i]||'').toLowerCase().indexOf('ar')===0)return 'ar';}
  return 'en';
})();
function apply(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  var els=document.querySelectorAll('[data-en]');
  for(var i=0;i<els.length;i++){var v=els[i].getAttribute('data-'+lang);if(v)els[i].innerHTML=v;}
  document.getElementById('langBtn').textContent=lang==='en'?'العربية':'English';
  try{localStorage.setItem('lr_lang',lang);}catch(e){}
}
document.getElementById('langBtn').onclick=function(){lang=lang==='en'?'ar':'en';apply();};
document.getElementById('yr').textContent=new Date().getFullYear();
apply();
</script>
<script>
/* صفحة 404: نقرأ الرابط المطلوب ونقترح أقرب دولة أو مقال يشبهه */
(function(){
  var path=decodeURIComponent(location.pathname||'/');
  document.getElementById('nfPath').textContent=location.host+path;
  var isAr=(document.documentElement.lang||'').indexOf('ar')===0;
  document.getElementById('nfQ').placeholder=isAr?'ابحث عن محطة أو دولة أو مقال':'Search a station, country or article';
  if(window.gtag)gtag('event','page_not_found',{page_path:path});

  function key(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');}
  /* تشابه بين كلمتين: عدد الحروف الثنائية المشتركة */
  function sim(a,b){
    if(!a||!b)return 0;if(a===b)return 1;
    if(a.indexOf(b)>-1||b.indexOf(a)>-1)return .9;
    var g=function(s){var o={};for(var i=0;i<s.length-1;i++){var k=s.substr(i,2);o[k]=(o[k]||0)+1;}return o;};
    var x=g(a),y=g(b),n=0,t=0,k;
    for(k in x){t+=x[k];if(y[k])n+=Math.min(x[k],y[k]);}
    for(k in y)t+=y[k];
    return t?2*n/t:0;
  }
  function flag(cc){
    if(!cc||cc.length!==2)return '🌐';
    try{return String.fromCodePoint(0x1F1E6+cc.toUpperCase().charCodeAt(0)-65,0x1F1E6+cc.toUpperCase().charCodeAt(1)-65);}catch(e){return '🌐';}
  }
  var slug=key((path.split('/').pop()||'').replace(/\.html?$/,''));
  var list=document.getElementById('nfList'),sec=document.getElementById('nfSug');
  function add(href,ic,title,sub){
    var a=document.createElement('a');a.href=href;
    var f=document.createElement('span');f.className='fl';f.textContent=ic;
    var t=document.createElement('span');t.textContent=title;
    if(sub){var s=document.createElement('span');s.className='sm';s.textContent=sub;t.appendChild(s);}
    a.appendChild(f);a.appendChild(t);list.appendChild(a);
  }
  function show(){if(list.children.length)sec.style.display='block';}

  if(/^\/countries\//.test(path)){
    fetch('/countries-index.json').then(function(r){return r.ok?r.json():[];}).then(function(d){
      var best=(d||[]).map(function(c){return {c:c,s:Math.max(sim(slug,key(c.slug)),sim(slug,key(c.en)))};})
        .filter(function(x){return x.s>=.45;}).sort(function(a,b){return b.s-a.s;}).slice(0,4);
      best.forEach(function(x){
        var c=x.c;add('countries/'+c.slug+'.html',flag(c.cc),(isAr?(c.ar||c.en):c.en)+(isAr?' — راديو مباشر':' radio live'),
          c.n?((isAr?'':'')+c.n+(isAr?' محطة':' stations')):'');
      });
      show();
    }).catch(function(){});
  }else{
    fetch('/articles.json').then(function(r){return r.ok?r.json():[];}).then(function(d){
      var arts=(d||[]).map(function(a){return {a:a,s:slug?Math.max(sim(slug,key(a.slug)),sim(slug,key((a.title||{}).en))):0};});
      var hits=arts.filter(function(x){return x.s>=.45;}).sort(function(a,b){return b.s-a.s;}).slice(0,4);
      if(!hits.length){
        hits=arts.slice().sort(function(a,b){return String(b.a.date||'').localeCompare(String(a.a.date||''));}).slice(0,4);
        document.getElementById('nfSugT').textContent=isAr?'أحدث المقالات':'Latest articles';
      }
      hits.forEach(function(x){
        var a=x.a,t=a.title||{};
        add('articles/'+a.slug+'.html','📰',(isAr?(t.ar||t.en):(t.en||t.ar))||a.slug,'');
      });
      show();
    }).catch(function(){});
  }
})();
</script>
